server:
  port: 8090

spring:
  application:
    version: @project.version@
  datasource:
    beanLog: jdbc:p6spy:sqlite:/qinglong/data/db/bean-log.db
    loginLog: jdbc:p6spy:sqlite:/qinglong/data/db/login-log.db
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver

logging:
  config: classpath:logback-jdx.xml

management:
  endpoints:
    web:
      exposure:
        include: health, info

qywx:
  getToken: https://qyapi.weixin.qq.com/cgi-bin/gettoken?corpid=ID&corpsecret=SECRET
  # 文档：https://work.weixin.qq.com/api/doc#10167
  getuserid: https://qyapi.weixin.qq.com/cgi-bin/user/getuserid?access_token=ACCESS_TOKEN
  getuserinfo: https://qyapi.weixin.qq.com/cgi-bin/user/get?access_token=ACCESS_TOKEN&userid=USERID
  update: https://qyapi.weixin.qq.com/cgi-bin/user/update?access_token=ACCESS_TOKEN
  create: https://qyapi.weixin.qq.com/cgi-bin/user/create?access_token=ACCESS_TOKEN

key: username@password:jdx-v${spring.application.version}
